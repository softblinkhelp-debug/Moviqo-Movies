<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviqo Movies - Stream & Discover</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(20, 20, 20, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e50914;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 30px;
            padding: 8px 16px;
            width: 300px;
            border: 1px solid #333;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            padding-left: 8px;
            font-size: 14px;
        }
        .search-box i {
            color: #888;
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .hero p {
            font-size: 16px;
            color: #aaa;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .container {
            padding: 40px 5%;
        }
        .categories {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .cat-btn {
            background: #222;
            color: #fff;
            border: 1px solid #333;
            padding: 8px 18px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }
        .cat-btn.active, .cat-btn:hover {
            background: #e50914;
            border-color: #e50914;
        }
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 12px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
        }
        .movie-card:hover::after {
            content: "\f04b";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #fff;
            background: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .movie-info {
            padding: 15px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 13px;
        }
        .rating {
            color: #f5c518;
            font-weight: 500;
        }
        /* Modal Player Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1f1f1f;
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 Aspect Ratio */
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .modal-details {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }
        .close-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }
        .close-btn:hover {
            background: #b20710;
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #0f0f0f;
            color: #777;
            font-size: 14px;
            margin-top: 50px;
            border-top: 1px solid #222;
        }
        @media(max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .search-box { width: 100%; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-film"></i> Moviqo Movies</div>
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="filterMovies()">
        </div>
    </header>

    <div class="hero">
        <h1>Unlimited Movies & TV Shows</h1>
        <p>Explore a massive library of movies. Click any card to watch trailers!</p>
    </div>

    <div class="container">
        <!-- Categories -->
        <div class="categories">
            <button class="cat-btn active" onclick="filterCategory('All', this)">All Movies</button>
            <button class="cat-btn" onclick="filterCategory('Action', this)">Action</button>
            <button class="cat-btn" onclick="filterCategory('Sci-Fi', this)">Sci-Fi</button>
            <button class="cat-btn" onclick="filterCategory('Drama', this)">Drama</button>
            <button class="cat-btn" onclick="filterCategory('Animation', this)">Animation</button>
        </div>

        <div class="section-title" id="sectionTitle">All Movies</div>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Video Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <div class="video-container">
                <iframe id="movieIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="modal-details">
                <div class="modal-title" id="modalTitle">Movie Title</div>
                <button class="close-btn" onclick="closeModal()">Close Player</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Moviqo Movies. All rights reserved.
    </footer>

    <script>
        // Large Movie Database across categories
        const moviesList = [
            { title: "Inception", category: "Sci-Fi", rating: "8.8", year: "2010", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg", trailer: "https://www.youtube.com/embed/YoHD9XEInc0" },
            { title: "Interstellar", category: "Sci-Fi", rating: "8.7", year: "2014", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", trailer: "https://www.youtube.com/embed/zSWdZVtXT7E" },
            { title: "The Dark Knight", category: "Action", rating: "9.0", year: "2008", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg", trailer: "https://www.youtube.com/embed/EXeTwQWrcwY" },
            { title: "Avengers: Endgame", category: "Action", rating: "8.4", year: "2019", poster: "https://image.tmdb.org/t/p/w500/ulzhLuWrPK07P1dKDcbQLZXDWv7.jpg", trailer: "https://www.youtube.com/embed/TcMBFSGVi1c" },
            { title: "Spider-Man: Across the Spider-Verse", category: "Animation", rating: "8.7", year: "2023", poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg", trailer: "https://www.youtube.com/embed/cqGjhVJWtEg" },
            { title: "Oppenheimer", category: "Drama", rating: "8.9", year: "2023", poster: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg", trailer: "https://www.youtube.com/embed/uYPbbksJxIg" },
            { title: "Avatar: The Way of Water", category: "Sci-Fi", rating: "7.6", year: "2022", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg", trailer: "https://www.youtube.com/embed/d9MyW72ELq0" },
            { title: "The Matrix", category: "Sci-Fi", rating: "8.7", year: "1999", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg", trailer: "https://www.youtube.com/embed/vKQi3bBA1y8" },
            { title: "Gladiator", category: "Action", rating: "8.5", year: "2000", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg", trailer: "https://www.youtube.com/embed/P5c_o_GiNfk" },
            { title: "Titanic", category: "Drama", rating: "7.9", year: "1997", poster: "https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg", trailer: "https://www.youtube.com/embed/kVrqfYjkTdQ" },
            { title: "The Lord of the Rings: Fellowship", category: "Action", rating: "8.8", year: "2001", poster: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg", trailer: "https://www.youtube.com/embed/V75dMMIW2B4" },
            { title: "Joker", category: "Drama", rating: "8.4", year: "2019", poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg", trailer: "https://www.youtube.com/embed/zAGVQLHvwOY" },
            { title: "Spider-Man: No Way Home", category: "Action", rating: "8.2", year: "2021", poster: "https://image.tmdb.org/t/p/w500/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg", trailer: "https://www.youtube.com/embed/JfVOs4VSpmA" },
            { title: "John Wick: Chapter 4", category: "Action", rating: "7.7", year: "2023", poster: "https://image.tmdb.org/t/p/w500/vZloFAK7NmvMGKE7VkF5UHaz0I.jpg", trailer: "https://www.youtube.com/embed/qEVUtrk8_B4" },
            { title: "Top Gun: Maverick", category: "Action", rating: "8.3", year: "2022", poster: "https://image.tmdb.org/t/p/w500/62HCnUTziyWcpDaBO2i1DX17ljH.jpg", trailer: "https://www.youtube.com/embed/giXco2jaZ_4" },
            { title: "Interstellar", category: "Sci-Fi", rating: "8.7", year: "2014", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg", trailer: "https://www.youtube.com/embed/zSWdZVtXT7E" },
            { title: "The Super Mario Bros. Movie", category: "Animation", rating: "7.1", year: "2023", poster: "https://image.tmdb.org/t/p/w500/qNBAXBIQlnGThuVvA6mA2B6ggV6.jpg", trailer: "https://www.youtube.com/embed/TnGl01FkMMo" },
            { title: "Spider-Man: Into the Spider-Verse", category: "Animation", rating: "8.4", year: "2018", poster: "https://image.tmdb.org/t/p/w500/iiZZdoQBEYBv6id8su7ImL0oCbD.jpg", trailer: "https://www.youtube.com/embed/g4Hbz2jLxvQ" },
            { title: "The Shawshank Redemption", category: "Drama", rating: "9.3", year: "1994", poster: "https://image.tmdb.org/t/p/w500/q6y0Go1tsGEsmtFryDOJo3dEmqu.jpg", trailer: "https://www.youtube.com/embed/NmzuHjWmQXo" },
            { title: "Fight Club", category: "Drama", rating: "8.8", year: "1999", poster: "https://image.tmdb.org/t/p/w500/pB8BM7pdSp6B6Ih7QZ4DrQ3PmJK.jpg", trailer: "https://www.youtube.com/embed/SUXWAEX2jlg" }
        ];

        let currentCategory = 'All';

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (movies.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 40px;">No movies found.</p>';
                return;
            }

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(movie);
                card.innerHTML = `
                    <img src="${movie.poster}" class="movie-poster" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                    <div class="movie-info">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sectionTitle').innerText = category === 'All' ? 'All Movies' : category + ' Movies';
            
            applyFilters();
        }

        function filterMovies() {
            applyFilters();
        }

        function applyFilters() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            let filtered = moviesList;

            if (currentCategory !== 'All') {
                filtered = filtered.filter(m => m.category === currentCategory);
            }

            if (query) {
                filtered = filtered.filter(m => m.title.toLowerCase().includes(query));
            }

            displayMovies(filtered);
        }

        function openModal(movie) {
            const modal = document.getElementById('movieModal');
            const iframe = document.getElementById('movieIframe');
            const title = document.getElementById('modalTitle');
            
            title.innerText = movie.title;
            iframe.src = movie.trailer + "?autoplay=1";
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('movieModal');
            const iframe = document.getElementById('movieIframe');
            
            iframe.src = ""; // Stops the video
            modal.style.display = 'none';
        }

        // Initial render
        displayMovies(moviesList);
    </script>
</body>
</html>
