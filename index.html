<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviqo Movies - Stream & Discover</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(20, 20, 20, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e50914;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 30px;
            padding: 8px 16px;
            width: 300px;
            border: 1px solid #333;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            padding-left: 8px;
            font-size: 14px;
        }
        .search-box i {
            color: #888;
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .hero p {
            font-size: 16px;
            color: #aaa;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .container {
            padding: 40px 5%;
        }
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 12px;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
        }
        .movie-poster {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }
        .movie-info {
            padding: 15px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 13px;
        }
        .rating {
            color: #f5c518;
            font-weight: 500;
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #0f0f0f;
            color: #777;
            font-size: 14px;
            margin-top: 50px;
            border-top: 1px solid #222;
        }
        @media(max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .search-box { width: 100%; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-film"></i> Moviqo Movies</div>
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search movies..." onkeyup="filterMovies()">
        </div>
    </header>

    <div class="hero">
        <h1>Unlimited Movies & TV Shows</h1>
        <p>Discover and stream your favorite movies instantly.</p>
    </div>

    <div class="container">
        <div class="section-title">Featured Movies</div>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <footer>
        &copy; 2025 Moviqo Movies. All rights reserved.
    </footer>

    <script>
        // Reliable curated movie dataset with posters and ratings
        const moviesList = [
            { title: "Inception", rating: "8.8", year: "2010", poster: "https://image.tmdb.org/t/p/w500/edv5CZvWj09upOsy2Y6IwDhK8bt.jpg" },
            { title: "Interstellar", rating: "8.7", year: "2014", poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg" },
            { title: "The Dark Knight", rating: "9.0", year: "2008", poster: "https://image.tmdb.org/t/p/w500/qJ2tW6WMUDux911r6m7haRef0WH.jpg" },
            { title: "Avengers: Endgame", rating: "8.4", year: "2019", poster: "https://image.tmdb.org/t/p/w500/ulzhLuWrPK07P1dKDcbQLZXDWv7.jpg" },
            { title: "Spider-Man: Across the Spider-Verse", rating: "8.7", year: "2023", poster: "https://image.tmdb.org/t/p/w500/8Vt6mWEReuy4Of61Lnj5Xj704m8.jpg" },
            { title: "Oppenheimer", rating: "8.9", year: "2023", poster: "https://image.tmdb.org/t/p/w500/8Gxv8gSFCU0XGDykEGv7zR1n2ua.jpg" },
            { title: "Avatar: The Way of Water", rating: "7.6", year: "2022", poster: "https://image.tmdb.org/t/p/w500/t6HIqrRAclMCA60NsSmeqe9RmNV.jpg" },
            { title: "The Matrix", rating: "8.7", year: "1999", poster: "https://image.tmdb.org/t/p/w500/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg" },
            { title: "Gladiator", rating: "8.5", year: "2000", poster: "https://image.tmdb.org/t/p/w500/ty8TGRuvJLPUmAR1H1nRIsgwvim.jpg" },
            { title: "Titanic", rating: "7.9", year: "1997", poster: "https://image.tmdb.org/t/p/w500/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg" },
            { title: "The Lord of the Rings: The Fellowship of the Ring", rating: "8.8", year: "2001", poster: "https://image.tmdb.org/t/p/w500/6oom5QYQ2yQTMJIbnvbkBL9cHo6.jpg" },
            { title: "Joker", rating: "8.4", year: "2019", poster: "https://image.tmdb.org/t/p/w500/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg" }
        ];

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (movies.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 40px;">No movies found.</p>';
                return;
            }

            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.innerHTML = `
                    <img src="${movie.poster}" class="movie-poster" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                    <div class="movie-info">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = moviesList.filter(m => m.title.toLowerCase().includes(query));
            displayMovies(filtered);
        }

        // Render movies on page load
        displayMovies(moviesList);
    </script>
</body>
</html>
