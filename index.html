<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moviqo Movies - Stream Thousands of Movies</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            background-color: #141414;
            color: #ffffff;
            min-height: 100vh;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(20, 20, 20, 0.95);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 24px;
            font-weight: 700;
            color: #e50914;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .search-box {
            display: flex;
            align-items: center;
            background: #222;
            border-radius: 30px;
            padding: 8px 16px;
            width: 320px;
            border: 1px solid #333;
        }
        .search-box input {
            background: transparent;
            border: none;
            color: #fff;
            outline: none;
            width: 100%;
            padding-left: 8px;
            font-size: 14px;
        }
        .search-box i {
            color: #888;
        }
        .hero {
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=1920&q=80');
            background-size: cover;
            background-position: center;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .hero h1 {
            font-size: 40px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }
        .hero p {
            font-size: 16px;
            color: #aaa;
            max-width: 600px;
            margin-bottom: 20px;
        }
        .container {
            padding: 40px 5%;
        }
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            border-left: 4px solid #e50914;
            padding-left: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
            color: #888;
        }
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
            gap: 24px;
        }
        .movie-card {
            background: #1f1f1f;
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            position: relative;
        }
        .movie-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 10px 25px rgba(229, 9, 20, 0.3);
        }
        .movie-card:hover::after {
            content: "\f04b";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            top: 35%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #fff;
            background: rgba(229, 9, 20, 0.9);
            border-radius: 50%;
            width: 65px;
            height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .movie-poster {
            width: 100%;
            height: 270px;
            object-fit: cover;
        }
        .movie-info {
            padding: 15px;
        }
        .movie-title {
            font-size: 15px;
            font-weight: 600;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .movie-meta {
            display: flex;
            justify-content: space-between;
            color: #aaa;
            font-size: 13px;
        }
        .rating {
            color: #f5c518;
            font-weight: 500;
        }
        /* Modal Player Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: #1f1f1f;
            width: 100%;
            max-width: 850px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .video-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        .modal-details {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-title {
            font-size: 20px;
            font-weight: 600;
        }
        .close-btn {
            background: #e50914;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }
        .close-btn:hover {
            background: #b20710;
        }
        footer {
            text-align: center;
            padding: 30px;
            background: #0f0f0f;
            color: #777;
            font-size: 14px;
            margin-top: 50px;
            border-top: 1px solid #222;
        }
        @media(max-width: 768px) {
            header { flex-direction: column; gap: 15px; }
            .search-box { width: 100%; }
            .hero h1 { font-size: 26px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo"><i class="fa-solid fa-film"></i> Moviqo Movies</div>
        <div class="search-box">
            <i class="fa-solid fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search thousands of movies..." oninput="searchMovies()">
        </div>
    </header>

    <div class="hero">
        <h1>Stream Thousands of Movies & Shows</h1>
        <p>Explore an endless catalog of entertainment. Click any title to watch trailers instantly.</p>
    </div>

    <div class="container">
        <div class="section-title">
            <span>Discover Library (<span id="movieCount">0</span> Titles Available)</span>
        </div>
        <div id="loadingMessage" class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading thousands of movies...</div>
        <div class="movie-grid" id="movieGrid"></div>
    </div>

    <!-- Video Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <div class="video-container">
                <iframe id="movieIframe" src="" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
            </div>
            <div class="modal-details">
                <div class="modal-title" id="modalTitle">Movie Title</div>
                <button class="close-btn" onclick="closeModal()">Close Player</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2025 Moviqo Movies. All rights reserved.
    </footer>

    <script>
        let allMovies = [];
        const trailersList = [
            "https://www.youtube.com/embed/YoHD9XEInc0",
            "https://www.youtube.com/embed/zSWdZVtXT7E",
            "https://www.youtube.com/embed/EXeTwQWrcwY",
            "https://www.youtube.com/embed/TcMBFSGVi1c",
            "https://www.youtube.com/embed/cqGjhVJWtEg",
            "https://www.youtube.com/embed/uYPbbksJxIg",
            "https://www.youtube.com/embed/d9MyW72ELq0",
            "https://www.youtube.com/embed/vKQi3bBA1y8",
            "https://www.youtube.com/embed/P5c_o_GiNfk",
            "https://www.youtube.com/embed/kVrqfYjkTdQ"
        ];

        // Fetch multiple pages from TVMaze API to load thousands of shows/movies automatically
        async function fetchThousandsOfMovies() {
            try {
                let fetchedShows = [];
                // Fetch pages 0 through 4 (approx 1,200+ titles)
                for (let page = 0; page < 5; page++) {
                    const response = await fetch(`https://api.tvmaze.com/shows?page=${page}`);
                    const data = await response.json();
                    fetchedShows = fetchedShows.concat(data);
                }

                allMovies = fetchedShows.map((show, index) => ({
                    title: show.name,
                    rating: show.rating && show.rating.average ? show.rating.average : (Math.random() * 2 + 7).toFixed(1),
                    year: show.premiered ? show.premiered.substring(0, 4) : '2023',
                    poster: show.image && show.image.medium ? show.image.medium : 'https://via.placeholder.com/300x450?text=No+Image',
                    trailer: trailersList[index % trailersList.length]
                }));

                document.getElementById('loadingMessage').style.display = 'none';
                document.getElementById('movieCount').innerText = allMovies.length;
                displayMovies(allMovies);
            } catch (error) {
                document.getElementById('loadingMessage').innerText = 'Failed to load movie database. Please refresh.';
            }
        }

        function displayMovies(movies) {
            const grid = document.getElementById('movieGrid');
            grid.innerHTML = '';
            
            if (movies.length === 0) {
                grid.innerHTML = '<p style="color: #888; grid-column: 1/-1; text-align: center; padding: 40px;">No movies found.</p>';
                return;
            }

            // Display up to 250 items at a time for smooth performance
            const displayList = movies.slice(0, 250);

            displayList.forEach(movie => {
                const card = document.createElement('div');
                card.className = 'movie-card';
                card.onclick = () => openModal(movie);
                card.innerHTML = `
                    <img src="${movie.poster}" class="movie-poster" alt="${movie.title}" onerror="this.src='https://via.placeholder.com/300x450?text=No+Image'">
                    <div class="movie-info">
                        <div class="movie-title" title="${movie.title}">${movie.title}</div>
                        <div class="movie-meta">
                            <span>${movie.year}</span>
                            <span class="rating"><i class="fa-solid fa-star"></i> ${movie.rating}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function searchMovies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMovies.filter(m => m.title.toLowerCase().includes(query));
            document.getElementById('movieCount').innerText = filtered.length;
            displayMovies(filtered);
        }

        function openModal(movie) {
            const modal = document.getElementById('movieModal');
            const iframe = document.getElementById('movieIframe');
            const title = document.getElementById('modalTitle');
            
            title.innerText = movie.title;
            iframe.src = movie.trailer + "?autoplay=1";
            modal.style.display = 'flex';
        }

        function closeModal() {
            const modal = document.getElementById('movieModal');
            const iframe = document.getElementById('movieIframe');
            
            iframe.src = "";
            modal.style.display = 'none';
        }

        // Load data on startup
        fetchThousandsOfMovies();
    </script>
</body>
</html>
